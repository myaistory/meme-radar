# Install as meme-radar.service.d/native-rpc.conf only after explicit approval.
[Service]
EnvironmentFile=/etc/meme-radar/native-rpc.env
Environment=MEME_RADAR_BITQUERY_ENABLED=0
Environment=MEME_RADAR_NATIVE_RPC_MODE=primary
Environment=MEME_RADAR_NATIVE_RPC_BACKFILL_BLOCKS=500
Environment=MEME_RADAR_NATIVE_RPC_PRIMARY_PROBE_SECONDS=60
Environment=MEME_RADAR_NATIVE_RPC_PRIMARY_RECOVERY_SUCCESSES=3
